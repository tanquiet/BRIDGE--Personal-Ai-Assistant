services:
  - type: web
    name: bridge-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OLLAMA_MODEL
        value: gemma3:4b
      - key: OLLAMA_HOST
        sync: false